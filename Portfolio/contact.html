<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Contact | Spencer Cluff Design</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="thespence.css">
</head>
<body>
    
    <nav class="main-nav">
        <a href="index.html" class="logo-link">
            <img src="TSD Logo.png" alt="Home" class="logo-img">
        </a>
        
        <ul class="nav-links">
            <li><a href="portfolio.html">Portfolio</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html" class="contact-button">Contact</a></li>
        </ul>
    </nav>
    
    <main class="contact-page-main">
        <div class="contact-wrapper">
            
            <header class="contact-header">
                <p class="project-subtitle">LET'S COLLABORATE</p>
                <h1 class="page-title">Get in Touch.</h1>
                <p class="contact-description">I'm currently seeking new opportunities starting in 2026. Send a message about projects, roles, or just to say hello.</p>
            </header>

            <form action="#" method="POST" class="contact-form">
                
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Your Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="6" required></textarea>
                </div>
                
                <button type="submit" class="contact-button form-submit-btn hero-cta">SEND MESSAGE</button>
            </form>
            
        </div>
    </main>
    
    <footer class="main-footer">
        <div class="footer-wrapper">
            
            <div class="footer-social">
                <p>Social Media</p>
                <div class="social-links">
                    <a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer"><img src="social_15047507.png" alt="LinkedIn" ></a>
                    <a href="https://www.behance.net/" target="_blank" rel="noopener noreferrer"><img src="behance_1077121.png" alt="Behance" ></a>
                </div>
            </div>
            <div class="footer-copy">
                <p>&copy; The Spence Design 2025. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <script src="js/carousel.js"></script> 
</body>
</html>
